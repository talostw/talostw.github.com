<!DOCTYPE html>
<html lang="{{ page.lang | default: site.i18n.default | escape }}">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | escape }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
    <meta name="author" content="{{ site.author.name | escape }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/font-awesome/css/font-awesome.css" rel="stylesheet">
    <link href="/assets/css/style.css?body=1" rel="stylesheet" type="text/css" media="all">

    <script src="/assets/js/site.js" defer></script>
  </head>

  <body>

    <div class="navbar navbar-fixed-top">
      <div class="navbar-inner">
        <div class="container">
          {% include lang_home %}
          <!-- navbar collapsed icon -->
          <button type="button" class="btn btn-navbar" aria-controls="site-navigation" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="icon-bar"></span>
                  <span class="icon-bar"></span>
                  <span class="icon-bar"></span>
          </button>
           
          <a class="brand" href="{{ LANG_HOME | escape }}">{{ site.title | escape }}</a>
           
          <div class="nav-collapse" id="site-navigation">
            <ul class="nav">
              {% assign pages_list = site.pages %}
              {% assign group = 'navigation' %}
              {% include pages_list %}
            </ul>
            <ul class="nav pull-right">
              {% include langs_list %}
            </ul>
          </div>
        </div>
      </div>
    </div>

    <div class="container">

      <div class="content">
        {{ content }}
      </div>

      <footer>
        <p>&copy; {{ site.author.name | escape }} 2012</p>
      </footer>

    </div> <!-- /container -->
  </body>
</html>
